<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoKas</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #f5f7f2;
        font-family: Arial, sans-serif;
        color: #17332f;
      }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        max-width: 480px;
        text-align: center;
        background: white;
        border-radius: 20px;
        padding: 32px 24px;
        box-shadow: 0 18px 48px rgba(23,51,47,0.12);
      }
      .logo { font-size: 32px; font-weight: 700; margin-bottom: 18px; }
      .status { font-size: 16px; color: #4f5f5c; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">AutoKas</div>
      <div class="status">Sedang membuka aplikasi...</div>
    </div>
  </body>
</html>
